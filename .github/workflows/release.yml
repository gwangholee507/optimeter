name: Release

# v로 시작하는 태그(예: v0.1.0)를 push하면 아래 파일들을 만들어 GitHub Release에 첨부한다.
#   - optimeter-<버전>.jar               : 모든 OS용. JDK 17 이상이 있으면 `java -jar`로 실행
#   - optimeter-<버전>-macos-arm64.dmg   : Apple Silicon Mac용 앱. Java가 들어 있어 설치만 하면 됨
#   - optimeter-<버전>-macos-x64.dmg     : Intel Mac용 앱
# 하나라도 만들거나 확인하는 데 실패하면 Release를 만들지 않는다 (일부 파일만 올라간 릴리스가 생기지 않도록).
#
# 수동 실행(workflow_dispatch)으로도 돌릴 수 있다. 이때는 Release를 만들지 않고 파일들만
# 워크플로 아티팩트로 올리므로, 태그를 찍기 전에 릴리스 빌드를 미리 확인해볼 수 있다.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # GitHub Release 생성에 필요

jobs:
  jar:
    name: Build jar
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml

      # 테스트와 스모크 테스트가 실제 컴파일러를 호출한다
      - name: Install clang and gcc
        run: |
          sudo apt-get update
          sudo apt-get install -y clang gcc

      # 태그 v1.2.3 → 버전 1.2.3. 태그 없이 수동 실행한 경우에는 커밋 해시로 구분한다.
      - name: Decide version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            # 이 값은 아래 단계의 명령과 파일 이름에 그대로 들어가므로 형식을 엄격하게 확인한다
            if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              echo "태그는 v1.2.3 또는 v1.2.3-rc.1 형식이어야 합니다: $GITHUB_REF_NAME"
              exit 1
            fi
            echo "value=$version" >> "$GITHUB_OUTPUT"
          else
            echo "value=0.0.0-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          fi

      # 테스트까지 통과해야 jar가 만들어진다
      - name: Build runnable jar (with frontend)
        run: ./mvnw -B -Pbundle -Drevision=${{ steps.version.outputs.value }} package

      - name: Smoke test the jar
        run: bash ../.github/scripts/smoke-test.sh target/optimeter-${{ steps.version.outputs.value }}.jar

      - name: Upload jar as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimeter-${{ steps.version.outputs.value }}
          path: backend/target/optimeter-${{ steps.version.outputs.value }}.jar
          if-no-files-found: error

  # 위에서 만든 jar를 그대로 넣어 macOS 앱(.dmg)을 만든다. 앱에는 Java 런타임이 들어가는데,
  # 런타임은 CPU마다 달라서 Apple Silicon과 Intel 러너에서 각각 만든다.
  macos-app:
    name: Build macOS app (${{ matrix.arch }})
    needs: jar
    strategy:
      # 한쪽이 실패해도 다른 쪽 결과는 끝까지 확인한다
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    env:
      VERSION: ${{ needs.jar.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      # jpackage와, 앱에 넣을 Java 런타임이 이 JDK에서 나온다 (CI가 테스트하는 버전과 같은 17)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download jar
        uses: actions/download-artifact@v4
        with:
          name: optimeter-${{ env.VERSION }}
          path: dist

      - name: Build .dmg
        run: bash packaging/macos/build-dmg.sh "dist/optimeter-$VERSION.jar" "$VERSION" dist

      # 러너 이미지가 바뀌어 CPU가 달라졌는데 파일 이름만 보고 잘못 올리는 일이 없도록 확인한다
      - name: Check architecture
        run: test -f "dist/optimeter-$VERSION-macos-${{ matrix.arch }}.dmg"

      # 사용자가 받게 될 .dmg 안의 앱을 실제로 띄워서 화면과 API, 컴파일까지 확인한다
      - name: Smoke test the app
        run: bash .github/scripts/smoke-test-dmg.sh "dist/optimeter-$VERSION-macos-${{ matrix.arch }}.dmg"

      - name: Upload .dmg as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: optimeter-${{ env.VERSION }}-macos-${{ matrix.arch }}
          path: dist/optimeter-${{ env.VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: [jar, macos-app]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Download all files
        uses: actions/download-artifact@v4
        with:
          pattern: optimeter-${{ needs.jar.outputs.version }}*
          path: dist
          merge-multiple: true

      # 릴리스 노트는 지난 릴리스 이후 머지된 PR 제목으로 자동 생성된다
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ls -l dist
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
