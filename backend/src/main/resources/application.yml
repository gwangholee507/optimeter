server:
  port: 8080
  # 이 PC에서 오는 접속만 받는다. 이 서버는 받은 코드를 컴파일하고 (옵션으로) 실행까지 하므로,
  # 같은 네트워크의 다른 기기가 접속할 수 있으면 안 된다.
  # 정말 다른 기기에서 접속해야 한다면 신뢰할 수 있는 네트워크에서만
  # --server.address=0.0.0.0 (또는 환경 변수 SERVER_ADDRESS=0.0.0.0)으로 바꿔서 실행한다.
  address: 127.0.0.1

compiler:
  # 프론트엔드가 선택할 수 있는 컴파일러 목록. 화면은 이 순서를 유지한 채 language별로 묶어서 보여준다.
  #
  # language: 사용자 코드의 언어 (c, cpp, rust). 소스 파일 이름(c → input.c, cpp → input.cpp, rust → input.rs)이
  #   이 값으로 정해진다. 필수.
  # toolchain: 컴파일러 계열. 어떤 인자로 컴파일러를 부르고 설치 여부를 어떻게 확인할지가 이 값으로 정해진다. 필수.
  #   clang, gcc는 둘 다 -S / -c / -O2 같은 GCC식 인자를 쓰고, gcc는 진짜 GNU GCC인지까지 확인한다.
  #   rustc는 --emit / -C opt-level=2 같은 자체 인자를 쓴다.
  #   (사용할 수 있는 값은 toolchain 패키지의 Language, ToolchainKind 참고)
  #
  # candidates: 모든 OS에서 순서대로 시도해서, 서버에서 실제로 실행되는 첫 번째 것을 사용한다.
  #   PATH에 있는 실행 파일 이름이나 절대 경로를 적을 수 있다
  #   (예: Homebrew GCC는 "gcc-16"처럼 버전이 붙어 설치되므로 여러 버전을 후보로 나열).
  #   맨 앞의 ${OPTVIS_...:}는 환경 변수로 컴파일러 경로를 직접 지정하는 자리다. 설정하지 않으면
  #   빈 값이 되어 건너뛴다.  예) OPTVIS_GCC=/opt/gcc-15/bin/gcc  또는  OPTVIS_GCC=D:\tools\mingw64\bin\gcc.exe
  #
  # os-candidates: 그 OS에서만 candidates 뒤에 추가로 시도한다. PATH에 자동 등록되지 않는
  #   기본 설치 위치를 적어두는 용도. 키는 windows / macos / linux.
  options:
    - id: clang
      label: "Clang (LLVM)"
      language: c
      toolchain: clang
      candidates: ["${OPTVIS_CLANG:}", clang]
      os-candidates:
        windows:
          # MSYS2와 LLVM 공식 설치 프로그램은 기본적으로 PATH에 등록하지 않는다.
          - 'C:\msys64\ucrt64\bin\clang.exe'
          - 'C:\msys64\clang64\bin\clang.exe'
          - 'C:\msys64\mingw64\bin\clang.exe'
          - 'C:\Program Files\LLVM\bin\clang.exe'
    - id: gcc
      label: "GNU GCC"
      language: c
      toolchain: gcc
      # macOS 기본 "gcc"는 사실 Apple clang의 별칭이지만, toolchain: gcc는 버전 출력에서
      # "clang"이 보이면 걸러내므로 bare "gcc"를 후보 맨 끝에 둬도 안전하다
      # (Homebrew GCC 버전이 바뀌거나 Ubuntu 기본 gcc 버전이 달라져도 이 후보로 커버됨).
      candidates: ["${OPTVIS_GCC:}", gcc-16, gcc-15, gcc-14, gcc-13, gcc-12, gcc]
      os-candidates:
        windows:
          - 'C:\msys64\ucrt64\bin\gcc.exe'
          - 'C:\msys64\mingw64\bin\gcc.exe'
    # C++은 같은 계열(toolchain)의 C++용 실행 파일을 쓴다. clang/gcc로도 .cpp를 컴파일할 수는 있지만,
    # 실행 시간 측정을 위해 링크할 때 C++ 표준 라이브러리가 붙지 않아 실패한다.
    - id: clangxx
      label: "Clang++ (LLVM)"
      language: cpp
      toolchain: clang
      candidates: ["${OPTVIS_CLANGXX:}", clang++]
      os-candidates:
        windows:
          - 'C:\msys64\ucrt64\bin\clang++.exe'
          - 'C:\msys64\clang64\bin\clang++.exe'
          - 'C:\msys64\mingw64\bin\clang++.exe'
          - 'C:\Program Files\LLVM\bin\clang++.exe'
    - id: gxx
      label: "GNU G++"
      language: cpp
      toolchain: gcc
      # macOS 기본 "g++"도 Apple clang의 별칭이라 gcc와 같은 이유로 맨 끝에 둬도 안전하다.
      candidates: ["${OPTVIS_GXX:}", g++-16, g++-15, g++-14, g++-13, g++-12, g++]
      os-candidates:
        windows:
          - 'C:\msys64\ucrt64\bin\g++.exe'
          - 'C:\msys64\mingw64\bin\g++.exe'
    # Rust는 cargo 없이 rustc를 직접 부르므로 표준 라이브러리만 쓸 수 있다.
    # rustup은 셸 설정 파일로 ~/.cargo/bin을 PATH에 넣기 때문에, 셸을 거치지 않고 서버를 띄우면 PATH에 없을 수 있다.
    - id: rustc
      label: "rustc (LLVM)"
      language: rust
      toolchain: rustc
      candidates: ["${OPTVIS_RUSTC:}", rustc]
      os-candidates:
        windows:
          - '${user.home}\.cargo\bin\rustc.exe'
          - 'C:\msys64\ucrt64\bin\rustc.exe'
        macos:
          - '${user.home}/.cargo/bin/rustc'
        linux:
          - '${user.home}/.cargo/bin/rustc'

logging:
  level:
    com.compareopt.optvisualizer: INFO
